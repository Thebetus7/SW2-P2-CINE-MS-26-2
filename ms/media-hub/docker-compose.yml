services:
  media-hub-laravel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cine_media_hub_service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_NAME="Cine Center Media Hub"
      - APP_ENV=production
      - APP_PORT=8080
      - MONGO_DB_URI=mongodb://mongodb:27017/media_hub
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_KEY=cinecenter_admin
      - MINIO_SECRET=cinecenter_secret_2026
      - MINIO_BUCKET=cinema-assets
    depends_on:
      - mongodb
      - minio
    networks:
      - cine_media_network

  mongodb:
    image: mongo:7.0
    container_name: cine_media_hub_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=media_hub
    volumes:
      - media_mongo_data:/data/db
    networks:
      - cine_media_network

  minio:
    image: pgsty/silo:latest
    container_name: cine_media_hub_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=cinecenter_admin
      - MINIO_ROOT_PASSWORD=cinecenter_secret_2026
    command: server /data --console-address ":9001"
    volumes:
      - media_minio_data:/data
    networks:
      - cine_media_network

networks:
  cine_media_network:
    driver: bridge

volumes:
  media_mongo_data:
  media_minio_data:
